# Tests on every push and pull request. No AWS access, no secrets: a
# throwaway Postgres 16 container is the only service.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suites refuse a database whose name does not contain "test".
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/talon_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # One after the other: the backend suites share talon_test.
      - name: Backend regression tests
        run: npm run test:backend

      - name: Postgres repository tests
        run: npm run test:postgres --workspace backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build
